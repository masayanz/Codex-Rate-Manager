[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-rate-manager"
version = "0.1.0"
description = "Windows向けCodexレート復帰通知アプリ"
requires-python = ">=3.13"
dependencies = ["PySide6>=6.8,<7", "requests>=2.32,<3", "windows-toasts>=1.3,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pyinstaller>=6.11,<7"]

[project.gui-scripts]
codex-rate-manager = "codex_rate_manager.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
